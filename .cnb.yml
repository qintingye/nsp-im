version: v1.0
triggers:
- type: push
branches:
- main
stages:
- name: deploy-to-pages
image: alpine:latest
script: |
 echo ">>> 正在检查源文件..."
 ls -R deploy-pkg/liwang-jiankong/
 echo ">>> 正在将文件移动到根目录..."
 cp -r deploy-pkg/liwang-jiankong/* .
 echo ">>> 确认 index.html 是否存在..."
 ls -la index.html
 echo ">>> 开始部署..."
 cnb-pages-deploy