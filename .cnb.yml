main:
  push:
    - stages:
        - name: deploy-to-pages
          image: alpine:latest
          script:
            - echo ">>> 纯静态项目，跳过构建，直接部署"
            - mkdir -p /tmp/deploy
            # 核心动作：直接复制你的静态文件目录
            - cp -r deploy-pkg/liwang-jiankong/* /tmp/deploy/
            - ls -la /tmp/deploy
          artifacts:
            path: /tmp/deploy