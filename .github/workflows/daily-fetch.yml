name: NSP-IM Daily Fetch

on:
  schedule:
    # 每日北京时间 9:00（UTC 1:00）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install aiohttp beautifulsoup4 lxml requests jsonschema
      
      - name: Run fetchers
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          cd src
          python main_fetcher.py
      
      - name: Validate JSON (schema)
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          from jsonschema import Draft7Validator
          root = Path('.')
          schema_map = {
            'data/policies.json':      'src/schemas/policies.schema.json',
            'data/intelligence.json':  'src/schemas/intelligence.schema.json',
            'data/scenes.json':        'src/schemas/scenes.schema.json',
          }
          rc = 0
          for data_rel, schema_rel in schema_map.items():
            d, s = root/data_rel, root/schema_rel
            if not d.exists():
              print(f'[skip] {data_rel} 不存在')
              continue
            validator = Draft7Validator(json.loads(s.read_text(encoding='utf-8')))
            errs = list(validator.iter_errors(json.loads(d.read_text(encoding='utf-8'))))
            if errs:
              print(f'[FAIL] {data_rel} 有 {len(errs)} 处 schema 错误:')
              for e in errs[:5]:
                print(f'  - {list(e.absolute_path)}: {e.message}')
              rc = 1
            else:
              print(f'[OK]   {data_rel} 通过 schema 校验')
          sys.exit(rc)
          "
      
      - name: Commit & Push
        run: |
          git config user.email "nsp-im-bot@hermes.local"
          git config user.name "NSP-IM Bot"
          git add data/
          git commit -m "auto: 数据更新 $(date +%Y-%m-%d)" || exit 0
          git push
      
      - name: Notify
        if: failure()
        run: |
          echo "❌ NSP-IM 抓取失败，需要人工检查"
          # TODO: webhook 飞书
